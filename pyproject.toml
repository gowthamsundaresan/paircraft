[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.28" ]

[project]
name = "paircraft"
version = "0.1.0"
description = "Auditable radical-pair simulation, evidence, audit, and benchmark infrastructure"
readme = "README.md"
authors = [ { name = "Paircraft contributors" } ]
requires-python = ">=3.13,<3.16"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.5.4",
  "scipy>=1.18.1",
  "tifffile>=2026.10.28",
]
scripts.paircraft = "paircraft.cli:main"

[dependency-groups]
dev = [
  "mdformat>=0.7.22",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "pre-commit>=4.3",
  "pyproject-fmt>=2.6",
  "pytest>=8.4",
  "pytest-cov>=7",
  "ruff>=0.14",
  "scipy-stubs>=1.18.1.1",
  "yamllint>=1.37",
]

[tool.hatch]
build.targets.sdist.include = [
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]
build.targets.wheel.only-include = [
  "src/paircraft",
  "src/paircraft_benchmark_contract.py",
]
build.targets.wheel.sources = [ "src" ]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [ "src", "tests" ]
lint.select = [
  "A",
  "ANN",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PIE",
  "RUF",
  "SIM",
  "UP",
]
lint.per-file-ignores."tests/**/*.py" = [ "ANN", "S101" ]

[tool.mypy]
files = [ "src", "tests" ]
python_version = "3.13"
warn_unreachable = true
strict = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=paircraft",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]

[tool.coverage]
run.source = [ "paircraft" ]
run.branch = true
report.exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
report.skip_covered = true
report.show_missing = true
