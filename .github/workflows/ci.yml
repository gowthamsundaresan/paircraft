name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.13.8
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy src tests
      - name: Check project metadata formatting
        run: uv run pyproject-fmt --check pyproject.toml
      - name: Check Markdown formatting
        run: uv run mdformat --check AGENTS.md README.md CONTRIBUTING.md SECURITY.md
      - name: Lint YAML
        run: uv run yamllint .github .pre-commit-config.yaml
      - name: Audit dependencies
        run: uv run pip-audit

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.13.8
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 0.13.8
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify wheel in a clean environment
        run: |
          uv venv /tmp/paircraft-wheel --python 3.13
          uv pip install --python /tmp/paircraft-wheel/bin/python dist/*.whl
          /tmp/paircraft-wheel/bin/paircraft --version
      - name: Inspect source distribution
        run: tar -tf dist/*.tar.gz

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: paircraft:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image
        run: docker run --rm paircraft:test --version
